# AZ-104 official Microsoft Learn training map.
#
# The join between the skills-measured outline (content/domains.toml) and the official training
# curriculum. Each unit maps to the blueprint bullet(s) it serves. See CLAUDE.md "THE OFFICIAL
# CURRICULUM" for why the mismatches matter.
#
# STATUS: Domain 1 captured 2026-11-01 (via the Microsoft Learn MCP, from the live
# "AZ-104: Manage identities and governance in Azure" path and its 6 modules). Domains 2-5 are
# module-less seeds for now (their bullets show uncovered until captured).
#
# NOTE on D1 coverage gaps (bullets with NO training unit -> write from product docs):
#   D1.1.4 (external users), D1.3.2 (resource locks), D1.3.3 (tags), D1.3.6 (cost management).
#   The official path leans on two Fundamentals modules (core architectural components, policy
#   initiatives) rather than dedicated AZ-104 governance modules, so governance is thin on purpose.
#
# kind: intro | concept | exercise | assessment | summary   (only concept/exercise "teach")
# `n` is this map's own contiguous 1..N index per module (build.py validates contiguity); the slug
# keeps Microsoft's real unit slug even where their published numbering has gaps.
# Set off_blueprint = true on a unit that teaches something the exam never asks for (Skip fuel).
#
# Regenerate/verify with:  python3 build.py --check-learn-map

schema_version = 1
captured = 2026-11-01
unit_total = 51

